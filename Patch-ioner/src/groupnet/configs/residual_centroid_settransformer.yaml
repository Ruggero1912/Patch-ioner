# GroupNet Residual-Centroid Configuration with SetTransformer Branch
# Two-branch model: centroid (mean) + learned residual using set transformer

# Model architecture type
model_type: residual_centroid

# Embedding dimension (must match your backbone model)
# Common values: 384 (ViT-S), 512 (CLIP ViT-B), 768 (ViT-B), 1024 (ViT-L), 1536 (ViT-G)
embed_dim: 768

# Type of model for the residual branch
# Options: 'attention', 'transformer', 'set_transformer'
residual_model_type: set_transformer

# Configuration for the residual branch
residual_config:
  # Number of attention heads
  num_heads: 8
  
  # Number of encoder/decoder layers
  num_layers: 3
  
  # Number of inducing points for ISAB (Induced Set Attention Block)
  num_inducing_points: 32
  
  # Number of seed vectors for PMA (Pooling by Multihead Attention)
  num_seed_vectors: 1
  
  # Dimension of feedforward network
  dim_feedforward: 2048
  
  # Dropout probability
  dropout: 0.1
  
  # Whether to use ISAB (True) or regular SAB (False)
  use_isab: true

# Training notes:
# - The residual branch is initialized to output zeros at the start of training
# - This means the model initially predicts exactly the centroid (mean)
# - During training, the residual branch learns corrections to improve over the centroid baseline
# - The final output is: centroid + residual
