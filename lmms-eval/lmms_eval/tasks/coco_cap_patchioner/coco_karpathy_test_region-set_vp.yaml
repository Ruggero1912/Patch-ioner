# dataset_path: datasets/example_dataset
dataset_path: user/coco-karpathy_region-set_visualprompt
dataset_kwargs:
  token: True
task: "coco_karpathy_test_region-set_vp"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.coco_doc_to_visual_karpathy
doc_to_text: "Provide a one-sentence caption for the provided regions of the image marked by the red bounding boxes. Do not mention the red bounding boxes or the highlighting."
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 64
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.coco_process_result_karpathy
# Note that the metric name can be either a registed metric function (such as the case for GQA) or a key name returned by process_results
metric_list:
  - metric: coco_Bleu_4 
    aggregation : !function utils.coco_bleu4
    higher_is_better : true
  - metric: coco_Bleu_3
    aggregation : !function utils.coco_bleu3
    higher_is_better : true
  - metric: coco_Bleu_2
    aggregation : !function utils.coco_bleu2
    higher_is_better : true
  - metric: coco_Bleu_1
    aggregation : !function utils.coco_bleu1
    higher_is_better : true
  - metric: coco_METEOR
    aggregation : !function utils.coco_meteor
    higher_is_better : true
  - metric: coco_ROUGE_L
    aggregation : !function utils.coco_rougel
    higher_is_better : true
  - metric: coco_CIDEr
    aggregation : !function utils.coco_cider
    higher_is_better : true
  #- metric: coco_SPICE
  #  aggregation : !function utils.coco_spice
  #  higher_is_better : true
metadata:
  - version: 0.0
